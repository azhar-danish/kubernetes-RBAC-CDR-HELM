apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: 
  namespace: apache
  name: apache-manager
rules:
- apiGroups: ["","apps", "extensions","batch"]
  resources: ["pods","deployments", "replicasets", "jobs","services"]
  verbs: ["get", "watch", "list", "create", "update", "patch", "delete","apply"]