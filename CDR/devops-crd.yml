apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devops.azhargroup.com # must be in the form of <plural>.<group>
spec:
  group: azhargroup.com 
  names:
    plural: devops  
    singular: devop
    kind: DevOps
    shortNames:
      - dev
      - dops
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties: 
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: "Name of the DevOps batch"
                duration:
                  type: string
                  description: "Duration of the DevOps batch"
                mode:
                  type: string
                  description: "Mode of the DevOps batch"
                platform:
                  type: string
                  description: "Platform of the DevOps batch" 
